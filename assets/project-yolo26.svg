  <text x="94" y="82" fill="#4d83d5" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Recognition</text>
  <text x="34" y="122" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="13.5">Automated labeling · model training · CPU/GPU inference</text>
  <text x="34" y="146" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="13.5">Real-time video streams and practical computer vision</text>
