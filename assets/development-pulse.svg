<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="285" viewBox="0 0 1200 285" role="img" aria-labelledby="title desc">
  <title id="title">Development Pulse</title>
  <desc id="desc">A light neumorphic workflow from idea through building, testing, learning and sharing</desc>
  <defs>
    <linearGradient id="flow"><stop stop-color="#a274ef"/><stop offset=".5" stop-color="#578ff3"/><stop offset="1" stop-color="#33bdc8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="8" dy="8" stdDeviation="9" flood-color="#acbac8" flood-opacity=".55"/><feDropShadow dx="-8" dy="-8" stdDeviation="9" flood-color="#ffffff"/></filter>
    <filter id="glow" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="node" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="4" dy="4" stdDeviation="5" flood-color="#a9b7c5" flood-opacity=".55"/><feDropShadow dx="-4" dy="-4" stdDeviation="5" flood-color="#ffffff"/></filter>
  </defs>
  <rect width="1200" height="285" fill="#eef3f8"/>
  <rect x="18" y="18" width="1164" height="249" rx="30" fill="#eef3f8" filter="url(#shadow)"/>
  <text x="50" y="62" fill="#334155" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">DEVELOPMENT PULSE</text>
  <text x="1150" y="62" text-anchor="end" fill="#8b9aab" font-family="Consolas,monospace" font-size="13">KEEP SHIPPING_</text>
  <path d="M120 158H1080" stroke="#d7e0e9" stroke-width="7" stroke-linecap="round"/>
  <path d="M120 158C230 158 245 114 350 114S470 180 580 180 695 116 810 116 925 158 1080 158" fill="none" stroke="url(#flow)" stroke-width="4" filter="url(#glow)"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g filter="url(#node)"><circle cx="120" cy="158" r="19" fill="#eadfff" stroke="#9564d4" stroke-width="3"/></g><text x="120" y="221" fill="#6846a5" font-size="15" font-weight="700">IDEA</text><text x="120" y="243" fill="#8b9aab" font-size="12">observe</text>
    <g filter="url(#node)"><circle cx="350" cy="114" r="19" fill="#e2e5ff" stroke="#7276d7" stroke-width="3"/></g><text x="350" y="221" fill="#555bb0" font-size="15" font-weight="700">BUILD</text><text x="350" y="243" fill="#8b9aab" font-size="12">implement</text>
    <g filter="url(#node)"><circle cx="580" cy="180" r="19" fill="#dceaff" stroke="#4f83d4" stroke-width="3"/></g><text x="580" y="221" fill="#426cae" font-size="15" font-weight="700">TEST</text><text x="580" y="243" fill="#8b9aab" font-size="12">validate</text>
    <g filter="url(#node)"><circle cx="810" cy="116" r="19" fill="#d9f2f6" stroke="#2ca7bd" stroke-width="3"/></g><text x="810" y="221" fill="#27879a" font-size="15" font-weight="700">LEARN</text><text x="810" y="243" fill="#8b9aab" font-size="12">improve</text>
    <g filter="url(#node)"><circle cx="1080" cy="158" r="19" fill="#daf5e6" stroke="#2aaa77" stroke-width="3"/></g><text x="1080" y="221" fill="#27815d" font-size="15" font-weight="700">SHARE</text><text x="1080" y="243" fill="#8b9aab" font-size="12">open source</text>
  </g>
</svg>
