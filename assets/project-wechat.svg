<svg xmlns="http://www.w3.org/2000/svg" width="580" height="230" viewBox="0 0 580 230" role="img" aria-labelledby="title desc">
  <title id="title">WeChat Mini Program Order</title>
  <desc id="desc">A light neumorphic project card for a JavaScript ordering mini program</desc>
  <defs>
    <linearGradient id="accent"><stop stop-color="#4fd19c"/><stop offset="1" stop-color="#55c8dc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="7" dy="7" stdDeviation="8" flood-color="#afbdca" flood-opacity=".58"/><feDropShadow dx="-7" dy="-7" stdDeviation="8" flood-color="#ffffff"/></filter>
    <filter id="mini" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#b7c3cf" flood-opacity=".55"/><feDropShadow dx="-3" dy="-3" stdDeviation="4" flood-color="#ffffff"/></filter>
  </defs>
  <rect width="580" height="230" fill="#eef3f8"/>
  <rect x="14" y="14" width="552" height="202" rx="24" fill="#eef3f8" filter="url(#shadow)"/>
  <rect x="14" y="14" width="552" height="7" rx="4" fill="url(#accent)"/>
  <circle cx="57" cy="61" r="23" fill="#d9f6e8" filter="url(#mini)"/><path d="M44 57c0-6 6-11 14-11s14 5 14 11-6 11-14 11h-4l-7 5 2-7c-3-2-5-5-5-9Z" fill="none" stroke="#289b69" stroke-width="2.5"/>
  <text x="94" y="57" fill="#334155" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">WeChat Mini Program</text>
  <text x="94" y="82" fill="#27966c" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Ordering Experience</text>
  <text x="34" y="122" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="13.5">Practical menu browsing · ordering flow · user experience</text>
  <text x="34" y="146" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="13.5">Product-focused application development for real users</text>
