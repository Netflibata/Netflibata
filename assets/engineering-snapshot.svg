<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Snapshot</title>
  <desc id="desc">A light neumorphic overview of AI vision, application development and practical delivery</desc>
  <defs>
    <linearGradient id="a"><stop stop-color="#9b6df2"/><stop offset="1" stop-color="#658df4"/></linearGradient>
    <linearGradient id="b"><stop stop-color="#56a9f5"/><stop offset="1" stop-color="#55c8dc"/></linearGradient>
    <linearGradient id="c"><stop stop-color="#4fd19c"/><stop offset="1" stop-color="#55c8dc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="8" dy="8" stdDeviation="9" flood-color="#acbac8" flood-opacity=".55"/><feDropShadow dx="-8" dy="-8" stdDeviation="9" flood-color="#ffffff"/></filter>
    <filter id="mini" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="4" dy="4" stdDeviation="5" flood-color="#b4c0cc" flood-opacity=".5"/><feDropShadow dx="-4" dy="-4" stdDeviation="5" flood-color="#ffffff"/></filter>
  </defs>
  <rect width="1200" height="340" fill="#eef3f8"/>
  <rect x="18" y="18" width="1164" height="304" rx="30" fill="#eef3f8" filter="url(#shadow)"/>
  <text x="50" y="60" fill="#334155" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">ENGINEERING SNAPSHOT</text>
  <text x="1150" y="60" text-anchor="end" fill="#8b9aab" font-family="Consolas,monospace" font-size="13">IDEA → CODE → PRODUCT</text>
  <g filter="url(#mini)">
    <rect x="43" y="92" width="350" height="190" rx="22" fill="#eef3f8"/>
    <rect x="43" y="92" width="350" height="6" rx="3" fill="url(#a)"/>
    <circle cx="85" cy="137" r="19" fill="#e8deff"/><text x="85" y="143" text-anchor="middle" fill="#6846b6" font-family="Consolas,monospace" font-size="14" font-weight="700">01</text>
    <text x="120" y="142" fill="#5e45a0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">AI VISION</text>
    <text x="70" y="181" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="14">YOLO26 · behavior recognition</text>
    <text x="70" y="208" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="14">Training · inference · RTSP streams</text>
    <text x="70" y="250" fill="#7758bd" font-family="Consolas,monospace" font-size="12">PYTHON  /  PYTORCH  /  OPENCV</text>
  </g>
  <g filter="url(#mini)">
    <rect x="425" y="92" width="350" height="190" rx="22" fill="#eef3f8"/>
    <rect x="425" y="92" width="350" height="6" rx="3" fill="url(#b)"/>
    <circle cx="467" cy="137" r="19" fill="#dcecff"/><text x="467" y="143" text-anchor="middle" fill="#326aa8" font-family="Consolas,monospace" font-size="14" font-weight="700">02</text>
    <text x="502" y="142" fill="#356f9b" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">APPLICATIONS</text>
    <text x="452" y="181" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="14">WeChat Mini Program experiences</text>
    <text x="452" y="208" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="14">Ordering flows · practical interfaces</text>
    <text x="452" y="250" fill="#3185a2" font-family="Consolas,monospace" font-size="12">JAVASCRIPT  /  WECHAT  /  UX</text>
  </g>
  <g filter="url(#mini)">
    <rect x="807" y="92" width="350" height="190" rx="22" fill="#eef3f8"/>
    <rect x="807" y="92" width="350" height="6" rx="3" fill="url(#c)"/>
    <circle cx="849" cy="137" r="19" fill="#daf5e6"/><text x="849" y="143" text-anchor="middle" fill="#287a57" font-family="Consolas,monospace" font-size="14" font-weight="700">03</text>
    <text x="884" y="142" fill="#2e7d5e" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">DELIVERY</text>
    <text x="834" y="181" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="14">Clean code · useful products</text>
    <text x="834" y="208" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="14">Build · experiment · learn · share</text>
    <text x="834" y="250" fill="#2d8c66" font-family="Consolas,monospace" font-size="12">GIT  /  GITHUB  /  LINUX</text>
  </g>
</svg>
