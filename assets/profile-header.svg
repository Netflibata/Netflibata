<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Netflibata</title>
  <desc id="desc">A light neumorphic profile banner for AI Vision, Mini Programs and Open Source</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8b5cf6"/><stop offset=".52" stop-color="#4f8df7"/><stop offset="1" stop-color="#22b8cf"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fbff"/><stop offset="1" stop-color="#e6edf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="9" dy="9" stdDeviation="10" flood-color="#aebdca" flood-opacity=".55"/>
      <feDropShadow dx="-8" dy="-8" stdDeviation="10" flood-color="#ffffff" flood-opacity=".98"/>
    </filter>
    <filter id="smallShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="4" dy="4" stdDeviation="5" flood-color="#b8c4d0" flood-opacity=".55"/>
      <feDropShadow dx="-4" dy="-4" stdDeviation="5" flood-color="#ffffff"/>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#94a3b8" opacity=".18"/></pattern>
  </defs>
  <rect width="1200" height="300" fill="#eef3f8"/>
  <rect x="20" y="20" width="1160" height="260" rx="32" fill="url(#soft)" filter="url(#shadow)"/>
  <rect x="20" y="20" width="1160" height="260" rx="32" fill="url(#dots)" opacity=".65"/>
  <circle cx="1080" cy="58" r="118" fill="#dff5fb" opacity=".7"/>
  <circle cx="130" cy="284" r="105" fill="#eee7ff" opacity=".8"/>
  <g filter="url(#smallShadow)">
    <rect x="62" y="48" width="188" height="31" rx="16" fill="#eef3f8" stroke="#d8c9ff"/>
    <circle cx="82" cy="63.5" r="5" fill="#22b8cf"/>
    <text x="98" y="68" fill="#6d5cae" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">OPEN SOURCE PROFILE</text>
  </g>
  <text x="60" y="157" fill="url(#accent)" font-family="Segoe UI,Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="4">NETFLIBATA</text>
  <rect x="62" y="178" width="520" height="5" rx="3" fill="url(#accent)" opacity=".9"/>
  <text x="62" y="218" fill="#4b5f78" font-family="Segoe UI,Arial,sans-serif" font-size="21" letter-spacing="1">AI VISION  •  MINI PROGRAMS  •  OPEN SOURCE</text>
  <text x="62" y="251" fill="#8493a7" font-family="Consolas,monospace" font-size="14">turning ideas into practical software_</text>
  <g fill="none" stroke="#78aef8" stroke-width="2.5" stroke-opacity=".8">
    <path d="M850 75L950 50 1050 96 1120 58M850 75L900 155 1015 169 1095 123M950 50L900 155M1050 96L1015 169M1095 123L1120 58"/>
  </g>
  <g fill="#eef3f8" stroke="#57b9dd" stroke-width="2" filter="url(#smallShadow)">
    <circle cx="850" cy="75" r="11"/><circle cx="950" cy="50" r="9"/><circle cx="1050" cy="96" r="13"/>
    <circle cx="1120" cy="58" r="8"/><circle cx="900" cy="155" r="13"/><circle cx="1015" cy="169" r="10"/><circle cx="1095" cy="123" r="12"/>
  </g>
  <g font-family="Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle" filter="url(#smallShadow)">
    <rect x="826" y="218" width="70" height="34" rx="12" fill="#eadfff"/><text x="861" y="240" fill="#7148c8">AI</text>
    <rect x="912" y="218" width="70" height="34" rx="12" fill="#dceaff"/><text x="947" y="240" fill="#316dcc">CV</text>
    <rect x="998" y="218" width="70" height="34" rx="12" fill="#d9f4f5"/><text x="1033" y="240" fill="#16869b">APP</text>
  </g>
</svg>
