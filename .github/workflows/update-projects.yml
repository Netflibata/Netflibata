name: Update latest public projects

on:
  schedule:
    - cron: "17 */6 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-projects.yml"
      - "scripts/update-projects.mjs"

permissions:
  contents: write

concurrency:
  group: profile-projects-update
  cancel-in-progress: false

jobs:
  update-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Refresh latest public projects
        run: node scripts/update-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes when needed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh latest public projects"
          git push
